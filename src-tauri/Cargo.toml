[package]
name = "quill_markdown"
version = "0.1.0"
description = "A quiet, local-first Markdown editor with live preview"
authors = ["Quill Contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "quill_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
